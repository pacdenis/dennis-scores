bio_ru: >-
  Денис Пацюк — хормейстер, аранжировщик и композитор, дирижёр, работает с хоровыми,
  оркестровыми и продюсерскими коллективами по всему миру. На данный момент является
  хормейстером симфонического оркестра Lords of the Sound, где по необходимости
  замещает главного дирижёра.
bio_en: >-
  Dennis Patsiuk is a choirmaster, arranger, composer, and conductor, working with
  choral, orchestral, and production ensembles worldwide. He currently serves as
  chorus master for the symphonic orchestra Lords of the Sound, standing in for the
  principal conductor as needed.
education:
  - ru: "Брестский музыкальный колледж им. Г. Ширмы (2001 г.)"
    en: "Brest G. Shirma Music College (2001)"
  - ru: "Белорусская государственная академия музыки (2007 г.)"
    en: "Belarusian State Academy of Music (2007)"
closing_ru: >-
  Автор хоровых, сольных и детских произведений; готовит хоровые ноты и оркестровые
  партитуры к изданию и исполнению — от клавира до полного оркестрового состава.
closing_en: >-
  He composes choral, solo, and children's works, and prepares choral scores and
  orchestral parts for publication and performance — from piano reduction to full
  orchestral scoring.
